<div class="dt-container">
  <div class="card p-6 surface-card shadow-sm border-1 surface-border text-center">
    <!-- 404 Error Section -->
    <div class="mb-6">
      <div class="text-8xl font-bold text-primary mb-3 error-number">404</div>
      <h1 class="text-3xl font-semibold text-800 mb-3">Page Not Found</h1>
      <p class="text-lg text-600 mb-4">The page you're looking for doesn't exist or has been moved.</p>
    </div>

    <!-- Navigation Buttons -->
    <div class="flex justify-center gap-3 mb-6">
      <button pButton type="button" routerLink="/" 
              class="p-button-lg" 
              severity="primary">
        <i-tabler name="home" class="icon-sm mr-2"></i-tabler>
        Home
      </button>
    </div>

    <!-- Popular Tools Section -->
    <div class="mt-6">
      <h3 class="text-xl font-medium text-700 mb-4">Popular Developer Tools</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
        <button pButton type="button" 
                routerLink="/json-formatter" 
                class="p-button-outlined"
                severity="contrast">
          <i-tabler name="align-left-2" class="icon-sm mr-2"></i-tabler>
          JSON Formatter
        </button>
        
        <button pButton type="button" 
                routerLink="/base64" 
                class="p-button-outlined"
                severity="contrast">
          <i-tabler name="transform" class="icon-sm mr-2"></i-tabler>
          Base64 Encoder
        </button>
        
        <button pButton type="button" 
                routerLink="/url-encoder" 
                class="p-button-outlined"
                severity="contrast">
          <i-tabler name="unlink" class="icon-sm mr-2"></i-tabler>
          URL Encoder
        </button>
        
        <button pButton type="button" 
                routerLink="/color-converter" 
                class="p-button-outlined"
                severity="contrast">
          <i-tabler name="palette" class="icon-sm mr-2"></i-tabler>
          Color Converter
        </button>
        
        <button pButton type="button" 
                routerLink="/jwt-decode" 
                class="p-button-outlined"
                severity="contrast">
          <i-tabler name="key" class="icon-sm mr-2"></i-tabler>
          JWT Decoder
        </button>
        
        <button pButton type="button" 
                routerLink="/sql-formatter" 
                class="p-button-outlined"
                severity="contrast">
          <i-tabler name="database" class="icon-sm mr-2"></i-tabler>
          SQL Formatter
        </button>
      </div>
    </div>
  </div>
</div>
