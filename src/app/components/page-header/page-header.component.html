<div class="mb-2 p-3 flex justify-between items-center">
  <h2 class="text-lg text-700 ">
    <ng-content></ng-content>
  </h2>
  <button *ngIf="isFavorite" pButton type="button" [rounded]="true" [outlined]="false" (click)="toggleFavorite()"
    class="favorite-button">
    <i-tabler *ngIf="isFavorite" name="star-filled" class="icon-sm"></i-tabler>
  </button>
  <button *ngIf="!isFavorite" pButton type="button" [rounded]="true" [outlined]="true" (click)="toggleFavorite()"
    class="favorite-button">
    <i-tabler *ngIf="!isFavorite" name="star" class="icon-sm"></i-tabler>
  </button>
</div>
