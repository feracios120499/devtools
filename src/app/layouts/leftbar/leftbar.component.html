<div class="leftbar-menu" #menuContainer>
  <p-menu [model]="items" styleClass="w-full">
    <ng-template #submenuheader let-item>
      @if (item.label) {
        <div class="flex items-center justify-between py-2 px-3 cursor-pointer transition-colors"
          (click)="item.command && item.command()">
          <span class="text-primary font-bold">{{ item.label }}</span>
          @if (getSectionById(item.label)) {
            <i-tabler
              [name]="getSectionById(item.label)?.isCollapsed ? 'chevron-right' : 'chevron-down'"
              class="icon-sm text-primary">
            </i-tabler>
          }
        </div>
      }
    </ng-template>
    <ng-template #item let-item>
      <a pRipple class="flex items-center p-menu-item-link" [routerLink]="item.routerLink" routerLinkActive="active-menuitem" [routerLinkActiveOptions]="{exact: item.routerLink === '/'}">
        <!-- <span [class]="item.icon"></span> -->
        <i-tabler [name]="item.icon"></i-tabler>
        <span class="ml-2">{{ item.label }}</span>
        @if (item.isFavorite) {
          <i-tabler name="star-filled" class="ml-auto text-yellow-500 icon-sm"></i-tabler>
        }
        @if (item.shortcut) {
          <span class="ml-auto border border-surface rounded bg-emphasis text-muted-color text-xs p-1">
            {{ item.shortcut }}
          </span>
        }
      </a>
    </ng-template>
  </p-menu>
</div>
