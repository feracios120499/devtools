<!doctype html>
<html lang="en" class="my-app-dark">

<head>
  <meta charset="utf-8">
  <title>Devtools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="Professional online development tools including JSON formatter, validator, and viewer. Format, validate, and analyze JSON data instantly with our powerful, easy-to-use web tools designed for developers, testers, and data analysts. Save time with our intuitive interface and advanced features.">
  <!-- Only the two icon sizes modern iOS/iPadOS actually request. The rest were adding unnecessary HTTP 404s on cold load. -->
  <link rel="apple-touch-icon" sizes="152x152" href="/apple-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/android-icon-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="msapplication-TileColor" content="#00000000">
  <meta name="msapplication-TileImage" content="/ms-icon-144x144.png">
  <meta name="theme-color" content="#1e293b">
  <!-- Preconnect/dns-prefetch to speed up third-party handshakes when they finally load -->
  <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin>
  <link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.google-analytics.com">
  <!--
    Delay third-party scripts (GTM + AdSense) until the page is idle or the
    user interacts. gtag's dataLayer shim keeps events queuable before the
    real script lands. Cuts TBT on cold navigations.
  -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-XVNLKWJFTM');
    (function () {
      var loaded = {};
      function load(id, src, crossorigin) {
        if (loaded[id]) return;
        loaded[id] = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = src;
        if (crossorigin) s.crossOrigin = 'anonymous';
        document.head.appendChild(s);
      }
      function loadAll() {
        load('gtag', 'https://www.googletagmanager.com/gtag/js?id=G-XVNLKWJFTM');
        load('ads', 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5026615132103985', true);
      }
      function schedule() { setTimeout(loadAll, 1500); }
      if (document.readyState === 'complete') {
        schedule();
      } else {
        window.addEventListener('load', schedule, { once: true });
      }
      ['click', 'keydown', 'scroll', 'touchstart', 'mousemove'].forEach(function (evt) {
        window.addEventListener(evt, loadAll, { once: true, passive: true, capture: true });
      });
    })();
  </script>
</head>

<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
